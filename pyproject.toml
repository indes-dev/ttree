[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indes-ttree"
version = "0.2.0"
description = "Offline directory tree with token estimates and optional byte sizes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["tiktoken>=0.12,<1", "pypdf>=6.1,<7"]

[project.urls]
Homepage = "https://github.com/indes-dev/ttree"
Repository = "https://github.com/indes-dev/ttree"
Issues = "https://github.com/indes-dev/ttree/issues"

[project.scripts]
ttree = "ttree.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ttree"]
