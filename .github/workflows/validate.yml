name: Bounded candidate validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lowest-direct:
    runs-on: ubuntu-22.04 # worker tests require enabled unprivileged user/PID namespaces
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv pip install --system --resolution lowest-direct . 'tiktoken>=0.12,<1' 'pypdf>=6.19.0,<7'
      - run: mkdir -p .tmp && TMPDIR="$PWD/.tmp" timeout --kill-after=1 115 prlimit --as=2147483648 --cpu=60 --core=0 python -m unittest discover -s tests -v
  locked-artifact:
    runs-on: ubuntu-22.04 # worker tests require enabled unprivileged user/PID namespaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r locks/build-linux-cp312-x86_64.txt
      - run: mkdir -p .tmp && TMPDIR="$PWD/.tmp" python scripts/build_tracked.py .tmp/build
      - run: python scripts/build_offline.py .tmp/build/packages/indes_ttree-0.2.0-py3-none-any.whl .tmp/artifact
      - run: python -m pip install --no-index --find-links .tmp/artifact/wheels --require-hashes -r .tmp/artifact/install-lock.txt
      - run: TMPDIR="$PWD/.tmp" timeout --kill-after=1 115 prlimit --as=2147483648 --cpu=60 --core=0 python -m unittest discover -s tests -v
